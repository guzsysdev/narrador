<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Narrador IA — VoxCPM2</title>
  <link rel="stylesheet" href="/estatico/estilo.css" />
</head>
<body>
  <main class="oContainer">
    <h1>Narrador IA</h1>
    <p class="sSubtitulo">Geração de narração de vídeo com TTS local (VoxCPM2) — sem limites de duração.</p>

    <form id="oFormGeracao">
      <label for="oTexto">Texto da narração</label>
      <textarea id="oTexto" rows="10" placeholder="Cole aqui o roteiro completo da narração..." required></textarea>

      <div class="oLinha">
        <div class="oCampo">
          <label for="oNomeArquivo">Nome do arquivo</label>
          <input type="text" id="oNomeArquivo" value="narracao.wav" />
        </div>
        <div class="oCampo">
          <label for="oSeed">Seed (consistência de voz)</label>
          <input type="number" id="oSeed" value="42" />
        </div>
      </div>

      <label>Vozes reais (recomendado — clonagem de áudio de estúdio, sem a entonação forçada do Voice Design)</label>
      <div id="oListaVozesReais" class="oListaOpcoesVoz"></div>
      <p id="oMensagemErroVozReal" class="oErro oOculto"></p>

      <label for="oArquivoVozReferencia">Ou envie um áudio seu como referência (10-30s, uma pessoa só falando, sem música/ruído de fundo)</label>
      <div class="oLinhaPrevia">
        <input type="file" id="oArquivoVozReferencia" accept=".wav,.mp3,.ogg,.flac,.m4a,.aac,audio/*" />
        <button type="button" id="oBotaoPreviaUpload">▶ Gerar prévia</button>
      </div>
      <div id="oCardPreviaUpload" class="oOpcaoVoz oOculto">
        <audio id="oAudioPreviaUpload" controls></audio>
        <button type="button" id="oBotaoUsarUpload">Usar esta voz</button>
      </div>
      <p id="oMensagemErroUpload" class="oErro oOculto"></p>

      <details class="oDetalhesUpload">
        <summary>Ou usar Voice Design (gerar uma voz do zero por descrição — qualidade mais instável)</summary>

        <label for="oSelecaoVoz">Voz</label>
        <select id="oSelecaoVoz">
          <option value="masculina">Masculina (padrão)</option>
          <option value="feminina">Feminina</option>
          <option value="personalizada">Personalizada</option>
        </select>

        <label for="oVoz">Descrição da voz (Voice Design) — escreva em inglês, o modelo só interpreta bem inglês/chinês</label>
        <textarea id="oVoz" rows="2" disabled placeholder="e.g. a man in his 40s, warm and confident voice..."></textarea>

        <div class="oLinhaPrevia">
          <button type="button" id="oBotaoOpcoesVoz">🎲 Gerar opções de voz</button>
          <span id="oStatusVozEscolhida" class="oStatusVoz oOculto"></span>
        </div>
        <div id="oListaOpcoesVoz" class="oListaOpcoesVoz"></div>
        <p id="oMensagemErroPrevia" class="oErro oOculto"></p>
      </details>

      <div class="oLinha">
        <div class="oCampo">
          <label for="oVelocidade">Velocidade: <span id="oValorVelocidade">1.0x</span></label>
          <input type="range" id="oVelocidade" min="0.5" max="2.0" step="0.05" value="1.0" />
        </div>
        <div class="oCampo">
          <label for="oTom">Tom: <span id="oValorTom">0 semitons</span></label>
          <input type="range" id="oTom" min="-12" max="12" step="1" value="0" />
        </div>
      </div>

      <button type="submit" id="oBotaoGerar">Gerar narração</button>
    </form>

    <section id="oProgresso" class="oProgresso oOculto">
      <p id="oTextoProgresso">Na fila...</p>
      <div class="oBarraFundo">
        <div id="oBarraPreenchimento" class="oBarraPreenchimento"></div>
      </div>
    </section>

    <section id="oResultado" class="oResultado oOculto">
      <p>Narração gerada com sucesso!</p>
      <audio id="oPlayerAudio" controls></audio>
      <a id="oLinkDownload" class="oBotaoDownload" download>Baixar WAV</a>
    </section>

    <p id="oMensagemErro" class="oErro oOculto"></p>
  </main>

  <script src="/estatico/app.js"></script>
</body>
</html>
